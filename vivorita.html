<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>🧱 Neon Tetris</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #24164a 0%, #090914 48%, #030307 100%);
    color: white;
    font-family: Arial, Helvetica, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
    touch-action: none;
}

#game-container {
    width: 100%;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;
    gap: 25px;

    padding: 15px;
}

/* =========================
   TABLERO
========================= */

#board {
    width: min(55vh, 82vw);
    height: calc(min(55vh, 82vw) * 2);

    max-height: 82vh;
    max-width: 41vh;

    background: rgba(0,0,0,.55);

    border: 3px solid rgba(124,77,255,.7);
    border-radius: 15px;

    box-shadow:
        0 0 25px rgba(124,77,255,.35),
        inset 0 0 25px rgba(0,0,0,.7);

    display: grid;

    position: relative;
}

/* =========================
   PANEL
========================= */

#side-panel {
    width: 180px;

    display: flex;
    flex-direction: column;
    gap: 15px;
}

.title {
    font-size: 30px;
    font-weight: bold;

    background:
        linear-gradient(
            90deg,
            #00e5ff,
            #7c4dff,
            #ff4081
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    text-align: center;
}

.info-box {
    padding: 15px;

    border-radius: 15px;

    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.12);

    text-align: center;
}

.info-title {
    color: #9ca7b8;
    font-size: 13px;
    margin-bottom: 5px;
}

.info-value {
    font-size: 25px;
    font-weight: bold;
}

/* =========================
   BOTONES
========================= */

button {
    border: none;
    border-radius: 13px;

    padding: 13px;

    color: white;
    font-size: 15px;
    font-weight: bold;

    background:
        linear-gradient(
            135deg,
            #00bcd4,
            #7c4dff
        );

    box-shadow:
        0 5px 15px rgba(0,0,0,.3);

    cursor: pointer;

    touch-action: manipulation;
}

button:active {
    transform: scale(.94);
}

#restart {
    margin-top: 5px;
}

/* =========================
   CONTROLES CELULAR
========================= */

#controls {
    display: none;

    width: min(92vw, 420px);

    margin-top: 10px;

    grid-template-columns: repeat(4, 1fr);

    gap: 8px;
}

.control {
    height: 58px;

    font-size: 24px;

    padding: 0;

    border-radius: 14px;

    user-select: none;
}

#rotate {
    background:
        linear-gradient(
            135deg,
            #ff4081,
            #7c4dff
        );
}

#drop {
    background:
        linear-gradient(
            135deg,
            #00e5ff,
            #008cff
        );
}

/* =========================
   MENSAJE GAME OVER
========================= */

#game-over {
    position: fixed;

    inset: 0;

    display: none;

    justify-content: center;
    align-items: center;

    background: rgba(0,0,0,.75);

    z-index: 20;
}

.game-over-box {
    width: min(85vw, 350px);

    padding: 30px;

    text-align: center;

    border-radius: 22px;

    background: #11121d;

    border: 1px solid rgba(255,255,255,.15);

    box-shadow:
        0 20px 70px rgba(0,0,0,.6);
}

.game-over-box h2 {
    font-size: 35px;
}

#final-score {
    color: #00e5ff;
    font-size: 24px;
    font-weight: bold;
}

/* =========================
   CELULAR
========================= */

@media (max-width: 700px) {

    body {
        overflow: hidden;
    }

    #game-container {
        flex-direction: column;

        justify-content: center;

        gap: 8px;

        padding: 8px;
    }

    #side-panel {
        width: min(92vw, 420px);

        display: grid;

        grid-template-columns:
            1fr 1fr 1fr;

        gap: 7px;
    }

    .title {
        grid-column: 1 / -1;

        font-size: 27px;
    }

    .info-box {
        padding: 8px;
    }

    .info-title {
        font-size: 11px;
    }

    .info-value {
        font-size: 19px;
    }

    #restart {
        grid-column: 1 / -1;

        padding: 10px;
    }

    #board {
        width: min(78vw, 45vh);

        height: min(156vw, 90vh);

        max-width: none;
        max-height: none;

        border-width: 2px;
    }

    #controls {
        display: grid;
    }

}

/* =========================
   CELDA
========================= */

.cell {
    border: 1px solid rgba(255,255,255,.025);
    background: rgba(255,255,255,.015);
}

/* Colores de las piezas */

.cyan {
    background: #00e5ff;
    box-shadow: inset 0 0 8px white, 0 0 8px #00e5ff;
}

.yellow {
    background: #ffe600;
    box-shadow: inset 0 0 8px white, 0 0 8px #ffe600;
}

.purple {
    background: #b040ff;
    box-shadow: inset 0 0 8px white, 0 0 8px #b040ff;
}

.green {
    background: #35e879;
    box-shadow: inset 0 0 8px white, 0 0 8px #35e879;
}

.red {
    background: #ff405f;
    box-shadow: inset 0 0 8px white, 0 0 8px #ff405f;
}

.blue {
    background: #408cff;
    box-shadow: inset 0 0 8px white, 0 0 8px #408cff;
}

.orange {
    background: #ff8c32;
    box-shadow: inset 0 0 8px white, 0 0 8px #ff8c32;
}
</style>
</head>

<body>

<div id="game-container">

    <div id="side-panel">

        <div class="title">
            🧱 NEON TETRIS
        </div>

        <div class="info-box">
            <div class="info-title">PUNTOS</div>
            <div class="info-value" id="score">0</div>
        </div>

        <div class="info-box">
            <div class="info-title">LÍNEAS</div>
            <div class="info-value" id="lines">0</div>
        </div>

        <div class="info-box">
            <div class="info-title">NIVEL</div>
            <div class="info-value" id="level">1</div>
        </div>

        <button id="restart">
            🔄 REINICIAR
        </button>

    </div>

    <div id="board"></div>

    <div id="controls">

        <button
            class="control"
            id="left"
        >
            ◀️
        </button>

        <button
            class="control"
            id="rotate"
        >
            🔄
        </button>

        <button
            class="control"
            id="right"
        >
            ▶️
        </button>

        <button
            class="control"
            id="drop"
        >
            ⬇️
        </button>

    </div>

</div>


<div id="game-over">

    <div class="game-over-box">

        <h2>
            💀 GAME OVER
        </h2>

        <p>
            Puntuación final:
        </p>

        <div id="final-score">
            0
        </div>

        <br>

        <button id="restart-game-over">
            🔄 JUGAR DE NUEVO
        </button>

    </div>

</div>


<script>

/* =========================
   CONFIGURACIÓN
========================= */

const ROWS = 20;
const COLS = 10;

const boardElement =
    document.getElementById("board");

const scoreElement =
    document.getElementById("score");

const linesElement =
    document.getElementById("lines");

const levelElement =
    document.getElementById("level");


/* =========================
   TABLERO
========================= */

let board = [];

function createEmptyBoard() {

    return Array.from(
        { length: ROWS },
        () =>
            Array(COLS).fill(null)
    );

}


/* =========================
   PIEZAS
========================= */

const pieces = [

    {
        shape: [
            [1,1,1,1]
        ],
        color: "cyan"
    },

    {
        shape: [
            [1,1],
            [1,1]
        ],
        color: "yellow"
    },

    {
        shape: [
            [0,1,0],
            [1,1,1]
        ],
        color: "purple"
    },

    {
        shape: [
            [0,1,1],
            [1,1,0]
        ],
        color: "green"
    },

    {
        shape: [
            [1,1,0],
            [0,1,1]
        ],
        color: "red"
    },

    {
        shape: [
            [1,0,0],
            [1,1,1]
        ],
        color: "blue"
    },

    {
        shape: [
            [0,0,1],
            [1,1,1]
        ],
        color: "orange"
    }

];


/* =========================
   ESTADO
========================= */

let currentPiece = null;

let currentX = 0;
let currentY = 0;

let score = 0;
let lines = 0;
let level = 1;

let gameRunning = true;

let dropInterval = 800;
let lastDrop = 0;


/* =========================
   CREAR TABLERO VISUAL
========================= */

function createBoardVisual() {

    boardElement.innerHTML = "";

    boardElement.style.gridTemplateColumns =
        `repeat(${COLS}, 1fr)`;

    boardElement.style.gridTemplateRows =
        `repeat(${ROWS}, 1fr)`;


    for (
        let row = 0;
        row < ROWS;
        row++
    ) {

        for (
            let col = 0;
            col < COLS;
            col++
        ) {

            const cell =
                document.createElement("div");

            cell.className = "cell";

            cell.dataset.row = row;
            cell.dataset.col = col;

            boardElement.appendChild(cell);

        }

    }

}


/* =========================
   PIEZA NUEVA
========================= */

function newPiece() {

    const random =
        pieces[
            Math.floor(
                Math.random() *
                pieces.length
            )
        ];


    currentPiece = {

        shape:
            random.shape.map(
                row => [...row]
            ),

        color:
            random.color

    };


    currentX =
        Math.floor(
            COLS / 2 -
            currentPiece.shape[0].length / 2
        );

    currentY = 0;


    if (
        collision(
            currentPiece.shape,
            currentX,
            currentY
        )
    ) {

        gameOver();

    }

}


/* =========================
   COLISIÓN
========================= */

function collision(
    shape,
    x,
    y
) {

    for (
        let row = 0;
        row < shape.length;
        row++
    ) {

        for (
            let col = 0;
            col < shape[row].length;
            col++
        ) {

            if (
                !shape[row][col]
            ) {

                continue;

            }


            const newX =
                x + col;

            const newY =
                y + row;


            if (
                newX < 0 ||
                newX >= COLS ||
                newY >= ROWS
            ) {

                return true;

            }


            if (
                newY >= 0 &&
                board[newY][newX]
            ) {

                return true;

            }

        }

    }

    return false;

}


/* =========================
   DIBUJAR
========================= */

function draw() {

    const cells =
        boardElement.children;


    for (
        let row = 0;
        row < ROWS;
        row++
    ) {

        for (
            let col = 0;
            col < COLS;
            col++
        ) {

            const index =
                row * COLS + col;

            const cell =
                cells[index];

            cell.className =
                "cell";


            if (
                board[row][col]
            ) {

                cell.classList.add(
                    board[row][col]
                );

            }

        }

    }


    if (
        currentPiece
    ) {

        for (
            let row = 0;
            row < currentPiece.shape.length;
            row++
        ) {

            for (
                let col = 0;
                col < currentPiece.shape[row].length;
                col++
            ) {

                if (
                    !currentPiece.shape[row][col]
                ) {

                    continue;

                }


                const x =
                    currentX + col;

                const y =
                    currentY + row;


                if (
                    y >= 0 &&
                    y < ROWS &&
                    x >= 0 &&
                    x < COLS
                ) {

                    const index =
                        y * COLS + x;

                    cells[index].classList.add(
                        currentPiece.color
                    );

                }

            }

        }

    }

}


/* =========================
   MOVER
========================= */

function moveLeft() {

    if (!gameRunning) return;

    if (
        !collision(
            currentPiece.shape,
            currentX - 1,
            currentY
        )
    ) {

        currentX--;

        draw();

    }

}


function moveRight() {

    if (!gameRunning) return;

    if (
        !collision(
            currentPiece.shape,
            currentX + 1,
            currentY
        )
    ) {

        currentX++;

        draw();

    }

}


function moveDown() {

    if (!gameRunning) return;

    if (
        !collision(
            currentPiece.shape,
            currentX,
            currentY + 1
        )
    ) {

        currentY++;

    } else {

        lockPiece();

    }

    draw();

}


/* =========================
   CAÍDA RÁPIDA
========================= */

function hardDrop() {

    if (!gameRunning) return;

    while (
        !collision(
            currentPiece.shape,
            currentX,
            currentY + 1
        )
    ) {

        currentY++;

        score += 2;

    }

    lockPiece();

    draw();

    updateInfo();

}


/* =========================
   FIJAR PIEZA
========================= */

function lockPiece() {

    for (
        let row = 0;
        row < currentPiece.shape.length;
        row++
    ) {

        for (
            let col = 0;
            col < currentPiece.shape[row].length;
            col++
        ) {

            if (
                !currentPiece.shape[row][col]
            ) {

                continue;

            }


            const y =
                currentY + row;

            const x =
                currentX + col;


            if (
                y >= 0
            ) {

                board[y][x] =
                    currentPiece.color;

            }

        }

    }


    clearLines();

    newPiece();

}


/* =========================
   ELIMINAR LÍNEAS
========================= */

function clearLines() {

    let cleared = 0;


    for (
        let row = ROWS - 1;
        row >= 0;
        row--
    ) {

        if (
            board[row].every(
                cell => cell !== null
            )
        ) {

            board.splice(
                row,
                1
            );

            board.unshift(
                Array(COLS).fill(null)
            );

            cleared++;

            row++;

        }

    }


    if (cleared > 0) {

        lines += cleared;

        score +=
            [0,100,300,500,800][cleared] *
            level;


        level =
            Math.floor(
                lines / 10
            ) + 1;


        dropInterval =
            Math.max(
                100,
                800 -
                (level - 1) * 70
            );


        updateInfo();

    }

}


/* =========================
   GIRAR
========================= */

function rotatePiece() {

    if (!gameRunning) return;


    const oldShape =
        currentPiece.shape;


    const rows =
        oldShape.length;

    const cols =
        oldShape[0].length;


    const rotated =
        Array.from(
            { length: cols },
            () =>
                Array(rows).fill(0)
        );


    for (
        let row = 0;
        row < rows;
        row++
    ) {

        for (
            let col = 0;
            col < cols;
            col++
        ) {

            rotated[col][
                rows - 1 - row
            ] =
                oldShape[row][col];

        }

    }


    if (
        !collision(
            rotated,
            currentX,
            currentY
        )
    ) {

        currentPiece.shape =
            rotated;

    }

    else if (
        !collision(
            rotated,
            currentX - 1,
            currentY
        )
    ) {

        currentPiece.shape =
            rotated;

        currentX--;

    }

    else if (
        !collision(
            rotated,
            currentX + 1,
            currentY
        )
    ) {

        currentPiece.shape =
            rotated;

        currentX++;

    }


    draw();

}


/* =========================
   INFORMACIÓN
========================= */

function updateInfo() {

    scoreElement.textContent =
        score;

    linesElement.textContent =
        lines;

    levelElement.textContent =
        level;

}


/* =========================
   GAME OVER
========================= */

function gameOver() {

    gameRunning = false;

    document.getElementById(
        "final-score"
    ).textContent =
        score;

    document.getElementById(
        "game-over"
    ).style.display =
        "flex";

}


/* =========================
   REINICIAR
========================= */

function restartGame() {

    board =
        createEmptyBoard();

    score = 0;
    lines = 0;
    level = 1;

    dropInterval = 800;

    gameRunning = true;

    currentPiece = null;

    updateInfo();

    document.getElementById(
        "game-over"
    ).style.display =
        "none";

    newPiece();

    draw();

}


/* =========================
   LOOP
========================= */

function gameLoop(timestamp) {

    if (
        gameRunning &&
        timestamp - lastDrop >
        dropInterval
    ) {

        moveDown();

        lastDrop =
            timestamp;

    }

    draw();

    requestAnimationFrame(
        gameLoop
    );

}


/* =========================
   TECLADO
========================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            [
                "ArrowLeft",
                "ArrowRight",
                "ArrowDown",
                "ArrowUp",
                " ",
            ].includes(event.key)
        ) {

            event.preventDefault();

        }


        if (
            event.key === "ArrowLeft"
        ) {

            moveLeft();

        }


        if (
            event.key === "ArrowRight"
        ) {

            moveRight();

        }


        if (
            event.key === "ArrowDown"
        ) {

            moveDown();

        }


        if (
            event.key === "ArrowUp"
        ) {

            rotatePiece();

        }


        if (
            event.key === " "
        ) {

            hardDrop();

        }

    }
);


/* =========================
   BOTONES TÁCTILES
========================= */

function touchButton(
    id,
    action
) {

    const button =
        document.getElementById(id);


    button.addEventListener(
        "pointerdown",
        event => {

            event.preventDefault();

            action();

        }
    );

}


touchButton(
    "left",
    moveLeft
);

touchButton(
    "right",
    moveRight
);

touchButton(
    "rotate",
    rotatePiece
);

touchButton(
    "drop",
    hardDrop
);


/* =========================
   REINICIAR
========================= */

document.getElementById(
    "restart"
).addEventListener(
    "click",
    restartGame
);


document.getElementById(
    "restart-game-over"
).addEventListener(
    "click",
    restartGame
);


/* =========================
   INICIAR
========================= */

createBoardVisual();

restartGame();

requestAnimationFrame(
    gameLoop
);

</script>

</body>
</html>
